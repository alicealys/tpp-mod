/////////////////////////////////////////////
//   MGO3 Dedicated server configuration   //
/////////////////////////////////////////////
//                                         //
// Copy this file to                       //
// [game_folder]/tpp-mod/config/           //
// to customize your server config         //
//                                         //
/////////////////////////////////////////////

/////////////////////////////////////////////
//              Color codes                //
/////////////////////////////////////////////
//                                         //
// ^0 black                                //
// ^1 red                                  //
// ^2 green                                //
// ^3 yellow                               //
// ^4 purple                               //
// ^5 blue                                 //
// ^6 pink                                 //
// ^7 white                                //
// ^8 ally team                            //
// ^9 enemy team                           //
// ^: rainbow                              //
// ^; grey                                 //
//                                         //
/////////////////////////////////////////////

/////////////////////////////////////////////
//              General settings           //
/////////////////////////////////////////////

com_max_fps 100                            // max fps, doesn't really matter
lua_logging 0                              // enable lua logging, 1 = script loading, 2 = all logs
net_channel 0                              // network channel *
										   
fs_mod ""                                  // mod folder path (subfolder of mods/) *
sv_base_url ""                             // base url for mod downloading *
										   
match_password ""                          // set match password
match_restricted 0                         // restrict match to tpp-mod users only *
match_host_comment "^1MGO3^7 Server"       // custom host comment (can use color codes) *

                                           // *: only work for tpp-mod users

/////////////////////////////////////////////
//              Bans and Whitelist         //
/////////////////////////////////////////////

// ban 76561000000000000                   // use the 'ban <steam id>' command to ban a player
// ban 76561000000000001                   // use it multiple times to ban multiple players

whitelist_enable 0                         // enable/disable whitelist
// whitelist_add 76561000000000000         // add a player to whitelist
// whitelist_add 76561000000000001         // use it multiple times to whitelist multiple players

/////////////////////////////////////////////
//            Maps and Gamemodes           //
/////////////////////////////////////////////
//                                         //
// map ids                                 //
// 0 = JADE FOREST                         //
// 1 = GRAY RAMPART                        //
// 2 = RED FORTRESS                        //
// 3 = BLACK SITE                          //
// 4 = AMBER STATION                       //
// 5 = CORAL COMPLEX                       //
// 6 = AZURE MOUNTAIN                      //
// 7 = RUST PALACE                         //
//                                         //
// for custom maps use 'm_map_name <name>' //
//                                         //
// match rules / gamemode ids              //
// 1 = COMM CONTROL                        //
// 2 = BOUNTY HUNTER                       //
// 3 = CLOAK AND DAGGER                    //
// 8 = SABOTAGE                            //
//                                         //
/////////////////////////////////////////////

/////////////////////////////////////////////
//              Match settings             //
/////////////////////////////////////////////

matchset cheat_rate 100                    // unknown
matchset skill_level 37                    // unknown
matchset match_type 2                      // match type, leave it to 2
matchset rank 0                            // unknown
matchset member_max 16                     // max players

matchsetrule pl_match_type 2               // match type, leave it to 2
matchsetrule pl_match_num 5                // number of slots, 1-5
matchsetrule pl_auto_leave 0               // afk kick
matchsetrule pl_dlc 0                      // has dlc maps, doesn't matter
matchsetrule pl_member_min 2               // minimum members
matchsetrule pl_is_dedicated_host 1        // is dedicated host, leave it to 1
matchsetrule pl_briefing_time 60           // briefing time
matchsetrule pl_total_match 0              // total matches played, doesn't matter

/////////////////////////////////////////////
//              Match slots                //
/////////////////////////////////////////////

matchsetslot 0 m_match_rule 2
matchsetslot 0 m_map_id 3
matchsetslot 0 m_dn 0                      // day or night
matchsetslot 0 m_variant 1                 // rush mode
matchsetslot 0 m_time_limit 10
matchsetslot 0 m_tickets 99
matchsetslot 0 m_unique_char_solid 0       // toggle unique characters
matchsetslot 0 m_unique_char 0
matchsetslot 0 m_unique_char_liquid 0
matchsetslot 0 m_walker_gear 0
matchsetslot 0 m_weather_change 1

matchsetslot 1 m_match_rule 2
matchsetslot 1 m_map_id 0
matchsetslot 1 m_dn 1
matchsetslot 1 m_variant 1
matchsetslot 1 m_time_limit 10
matchsetslot 1 m_tickets 99
matchsetslot 1 m_unique_char_solid 0
matchsetslot 1 m_unique_char 0
matchsetslot 1 m_unique_char_liquid 0
matchsetslot 1 m_walker_gear 0
matchsetslot 1 m_weather_change 1

matchsetslot 2 m_match_rule 2
matchsetslot 2 m_map_id 4
matchsetslot 2 m_dn 0
matchsetslot 2 m_variant 0
matchsetslot 2 m_time_limit 10
matchsetslot 2 m_tickets 99
matchsetslot 2 m_unique_char_solid 0
matchsetslot 2 m_unique_char 0
matchsetslot 2 m_unique_char_liquid 0
matchsetslot 2 m_walker_gear 0
matchsetslot 2 m_weather_change 1

matchsetslot 3 m_match_rule 2
matchsetslot 3 m_map_id 5
matchsetslot 3 m_dn 0
matchsetslot 3 m_variant 0
matchsetslot 3 m_time_limit 10
matchsetslot 3 m_tickets 99
matchsetslot 3 m_unique_char_solid 0
matchsetslot 3 m_unique_char 0
matchsetslot 3 m_unique_char_liquid 0
matchsetslot 3 m_walker_gear 0
matchsetslot 3 m_weather_change 1

matchsetslot 4 m_match_rule 2
matchsetslot 4 m_map_id 2
matchsetslot 4 m_dn 0
matchsetslot 4 m_variant 0
matchsetslot 4 m_time_limit 10
matchsetslot 4 m_tickets 99
matchsetslot 4 m_unique_char_solid 0
matchsetslot 4 m_unique_char 0
matchsetslot 4 m_unique_char_liquid 0
matchsetslot 4 m_walker_gear 0
matchsetslot 4 m_weather_change 1

matchstart
